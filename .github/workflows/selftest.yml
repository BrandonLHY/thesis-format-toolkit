name: 自检

# 每次 push 和 PR 都跑全部自检，防止改坏已修好的行为。
# 这些自检覆盖了开发过程中踩过的坑（主题字体压制、outlineLvl 默认值、
# run 对象身份比较、字体链无效、参考文献序号误上标、跨 run 引用标记等），
# 是有回归保护价值的，不只是形式。
#
# 本地一键跑全部：python run_all_selftests.py

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 用免费的标准 runner（公开仓库不收费）。
        # 它的价值在于：可以真的执行 system_profiler 字体探测，
        # 并交叉验证 tests/fixtures 里的录制夹具是否与真机结构一致。
        # exclusions 用来避免跑太多组合、拉长排队时间。
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          # macOS runner 排队慢，只跑一个 Python 版本就够
          - os: macos-latest
            python-version: "3.10"

    # Windows runner 的 stdout 默认编码是 cp1252，打印中文会抛
    # UnicodeEncodeError 并让脚本崩掉（实测踩过）。
    # 脚本自身已用 console_io.enable_utf8_output() 做了保障，
    # 这里再显式设一遍环境变量作为双保险。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 依赖版本确认
        run: python -c "import docx, lxml.etree; print('python-docx', docx.__version__); print('lxml', lxml.etree.__version__)"

      # 验收检验：模拟全新用户走完整流程（依赖→造论文→识别→改写→核对）
      # 无图形显示的环境会自动跳过「界面构建」那一项（不是失败），
      # 所以这个可以在所有平台上都跑。
      - name: 验收检验
        run: python 验收检验.py

      # 对抗性 A：畸形输入（空文档、无 run、表格内段落、嵌套内容控件等）
      - name: 对抗性检验 A（边角与健壮性）
        run: python selftest_adversarial.py

      # 对抗性 B：保真度（文档属性、页眉页脚、书签、域、幂等性）
      - name: 对抗性检验 B（保真度与元数据）
        run: python selftest_fidelity.py

      - name: 假想论文端到端自检
        run: python selftest_synthetic.py

      - name: 跨平台字体自检
        run: python selftest_platform.py

      # 平台字体解析：含 macOS system_profiler 输出的录制回放。
      # 在 Windows 上也能跑——这正是做录制回放的目的。
      - name: 平台字体解析（含 macOS 录制回放）
        run: python selftest_fontparse.py

      # macOS 真机诊断：打印真实 system_profiler 结构，
      # 用于交叉验证录制夹具没有脱离现实。非 macOS 会自行跳过。
      - name: macOS 真机诊断
        run: python selftest_macos_live.py

      # macOS 环境模拟：在任意平台模拟 macOS 跑一遍全部套件，
      # 提前发现「只在 macOS 上才失败」的断言（真机 CI 每次只暴露第一个失败，
      # 这个可以一次列全）。放在真机诊断之后，方便对照。
      - name: macOS 环境模拟
        run: python selftest_macos_sim.py

      # Ubuntu runner 没有 X 显示，tkinter 建窗口会失败。
      # 「程序自检」里的界面项会自己探测并跳过，但为了不出意外，
      # 仍把它限定在 Windows 上跑。
      # macOS runner 的 tkinter 也可能不可用（已知问题），故同样限制。
      - name: 程序自检（含 GUI 构建）
        if: runner.os == 'Windows'
        run: python main.py --selftest

      # 上传自检报告（诊断附件）
      #
      # ★ continue-on-error 是必须的。实测踩过的坑：
      #   macOS 任务里这一步报 `Failed to FinalizeArtifact: ECONNRESET`——
      #   文件字节数与 SHA256 都已生成，只是最后一步「完成上传」的请求被网络重置。
      #   这是 GitHub 侧的临时网络问题，与代码无关，却让整个 CI 变红、
      #   看起来像 macOS 验证失败。附件只是排查用的诊断产物，不该有否决权。
      - name: 上传自检报告
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: 自检报告-${{ matrix.python-version }}
          path: 自检报告.txt
          if-no-files-found: ignore

      # macOS 诊断报告（真机 system_profiler 结构），失败时也上传便于排查
      # 同上：网络问题不应让 CI 变红
      - name: 上传 macOS 诊断报告
        if: always() && runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macOS诊断报告-${{ matrix.python-version }}
          path: macOS诊断报告.txt
          if-no-files-found: ignore

